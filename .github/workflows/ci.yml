# Written with AI assistance (Claude Code). See AI_USE.md.
# Every check in the project, run through the Makefile. A phase is done only when this is green.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the commit-trailer check
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Set up the pipeline environment
        run: make setup-python PYTHON=python
      - name: Lint
        run: make lint
      - name: Tests (guardrails, environment, CLI)
        run: make test-python
      - name: Guardrails (headers, secrets, commit trailers)
        run: make guardrails

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: make setup-web
      - name: License check
        run: make licenses
      - name: Type check and unit tests
        run: make test-web
      - name: Install the Playwright browser
        run: make setup-browsers
      - name: Build and run browser tests
        run: make e2e
      - name: Keep the Playwright report when tests fail
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
